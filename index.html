
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fred AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050b18;
  color: #00eaff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 36px;
  text-shadow: 0 0 15px #00eaff;
}

.orb {
  width: 150px;
  height: 150px;
  margin: 35px auto;
  border: 3px solid #00eaff;
  border-radius: 50%;
  box-shadow: 0 0 30px #00eaff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  50% {
    box-shadow: 0 0 55px #008cff;
  }
}

button {
  background: #00eaff;
  color: #050b18;
  border: none;
  padding: 13px 20px;
  margin: 8px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

input {
  width: 90%;
  max-width: 450px;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #00eaff;
  background: #101b30;
  color: white;
  margin-top: 20px;
}

#response {
  margin: 25px auto;
  max-width: 500px;
  padding: 15px;
  line-height: 1.6;
  color: white;
  background: #101b30;
  border-radius: 10px;
  min-height: 70px;
}
</style>
</head>

<body>

<h1>FRED AI</h1>
<p>Your Intelligent Virtual Assistant</p>

<div class="orb">F</div>

<input id="question" placeholder="Ask Fred anything...">

<br>

<button onclick="askFred()">ASK FRED</button>
<button onclick="startVoice()">🎤 SPEAK</button>

<div id="response">
Fred AI is online. How can I help you?
</div>

<script>
const API_ENDPOINT = "/.netlify/functions/chat";

async function askFred() {
  const question = document.getElementById("question").value.trim();
  const response = document.getElementById("response");

  if (!question) {
    response.textContent = "Please enter a question.";
    return;
  }

  response.textContent = "Fred is thinking...";

  try {
    const result = await fetch(API_ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: question})
    });

    const data = await result.json();

    if (!result.ok) throw new Error(data.error || "Request failed");

    response.textContent = data.reply || "No response received.";

    speak(data.reply || "");
  } catch (error) {
    response.textContent =
      "AI connection error. Please check the Netlify configuration.";
  }
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speech.rate = 1;

  speechSynthesis.speak(speech);
}

function startVoice() {
  const Recognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!Recognition) {
    document.getElementById("response").textContent =
      "Voice recognition is not supported by this browser.";
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "en-US";

  recognition.onresult = function(event) {
    document.getElementById("question").value =
      event.results[0][0].transcript;

    askFred();
  };

  recognition.onerror = function() {
    document.getElementById("response").textContent =
      "Microphone error. Check browser permissions.";
  };

  recognition.start();
}
</script>

</body>
</html>
